name: incidentes

# Toda la aplicación con `docker compose up -d`, sin preparar nada:
#   web     entrada única (http://localhost:8000): sirve el frontend y reenvía /api y /app (WebSocket)
#   api     Nginx de Laravel, también publicado para probar la API directamente (http://localhost:8080)
#   app     Laravel con php-fpm: al arrancar instala dependencias, genera su clave, migra y siembra
#   reverb  servidor de WebSockets de Laravel (tiempo real)
#   db      MySQL
#
# La configuración sale de .env.example (valores de demostración) y de .env, si existe, que los reemplaza.

x-configuracion: &configuracion
  # Vuelve solo si termina o si el servidor se reinicia. Reverb, además, termina sin error cuando se le pide reiniciar.
  restart: unless-stopped
  env_file:
    - path: .env.example
    - path: .env
      required: false

services:
  db:
    # Imágenes fijadas por su digest: lo que se probó es lo que corre. Dependabot propone las nuevas.
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    container_name: incidentes-db
    <<: *configuracion
    # MySQL toma usuario, contraseña y bases de las mismas variables DB_* que usa Laravel.
    entrypoint:
      - sh
      - -c
      - >-
        export MYSQL_DATABASE="$$DB_DATABASE" MYSQL_USER="$$DB_USERNAME" MYSQL_PASSWORD="$$DB_PASSWORD"
        MYSQL_ROOT_PASSWORD="$$DB_ROOT_PASSWORD" && exec docker-entrypoint.sh mysqld
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/docker/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      - ./backend/docker/mysql/crear-bd-pruebas.sh:/docker-entrypoint-initdb.d/crear-bd-pruebas.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Cola de trabajos y caché. Guarda en disco (AOF): un trabajo encolado no se pierde si el contenedor se reinicia.
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    container_name: incidentes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: ./backend/docker/php
    container_name: incidentes-app
    <<: *configuracion
    working_dir: /var/www/html
    command: ["sh", "docker/php/iniciar.sh", "php-fpm"]
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      - ./backend/docker/php/subidas.ini:/usr/local/etc/php/conf.d/subidas.ini:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/lista"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  reverb:
    build: ./backend/docker/php
    container_name: incidentes-reverb
    <<: *configuracion
    working_dir: /var/www/html
    command: ["sh", "docker/php/iniciar.sh", "php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy

  # Trabajos en segundo plano: los avisos de tiempo real, para que ninguna petición espere a Reverb. Se reinicia
  # cada hora (--max-time) para soltar memoria; reintenta tres veces y lo que falle queda en failed_jobs.
  cola:
    build: ./backend/docker/php
    container_name: incidentes-cola
    <<: *configuracion
    working_dir: /var/www/html
    command: ["sh", "docker/php/iniciar.sh", "php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--max-time=3600"]
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy

  # Tareas programadas (routes/console.php), como limpiar los tokens vencidos.
  programador:
    build: ./backend/docker/php
    container_name: incidentes-programador
    <<: *configuracion
    working_dir: /var/www/html
    command: ["sh", "docker/php/iniciar.sh", "php", "artisan", "schedule:work"]
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      app:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: incidentes-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: incidentes-web
    restart: unless-stopped
    # Solo la clave pública de Reverb: este contenedor da a Internet y no recibe ninguna contraseña.
    environment:
      REVERB_APP_KEY: ${REVERB_APP_KEY:-clave-publica-mesa-de-ayuda}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:80"
    depends_on:
      - api
      - reverb

volumes:
  db_data:
  redis_data:
  vendor:
