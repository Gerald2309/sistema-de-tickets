name: incidentes

services:
  db:
    image: mysql:8.4
    container_name: incidentes-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      DB_DATABASE_TEST: ${DB_DATABASE_TEST:?}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf:ro
      - ./docker/mysql/crear-bd-pruebas.sh:/docker-entrypoint-initdb.d/crear-bd-pruebas.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: ./docker/php
    container_name: incidentes-app
    working_dir: /var/www/html
    command: sh -c "chown -R www-data:www-data storage bootstrap/cache && exec php-fpm"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: incidentes-web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db_data:
  vendor:
