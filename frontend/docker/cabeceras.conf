# Cabeceras de seguridad de la aplicación (RNF-F12). Se incluyen en cada `location` que sirve archivos
# propios: en Nginx, un add_header dentro de una location anula los heredados.
# style-src 'unsafe-inline': Vuetify escribe los estilos del tema en una etiqueta <style> (nota N-05).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
