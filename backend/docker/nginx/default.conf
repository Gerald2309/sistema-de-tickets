server {
    listen 80;

    # PHP-FPM se busca por nombre cada vez, no solo al arrancar: si `app` se recrea (cambia de IP), sigue respondiendo.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php app:9000;
    server_tokens off;
    index index.php;
    root /var/www/html/public;
    # Mensajes con imágenes (el mismo tope que PHP, docker/php/subidas.ini).
    client_max_body_size 26m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # No publicar la versión de PHP.
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
